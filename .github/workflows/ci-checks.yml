name: ci-checks

on:
  workflow_call:
    secrets:
      NTFY_URL:
        required: false
      NTFY_TOKEN:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cl_test
          POSTGRES_USER: cl
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cl -d cl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: cl_test
      PGUSER: cl
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Notify on completion
        if: always()
        uses: ./.github/actions/ntfy-notify
        with:
          url: ${{ secrets.NTFY_URL }}
          token: ${{ secrets.NTFY_TOKEN }}
          title: >-
            CI ${{ job.status }}: ${{ github.event_name == 'pull_request'
            && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
            || format('Push to {0}', github.ref_name) }}
          message: Build ${{ job.status }} for context-library
          priority: ${{ job.status == 'success' && 'default' || 'high' }}
          tags: ${{ job.status == 'success' && 'white_check_mark' || 'x' }}
