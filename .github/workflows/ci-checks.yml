name: ci-checks

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true
      NTFY_URL:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cl_test
          POSTGRES_USER: cl
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cl -d cl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: cl_test
      PGUSER: cl
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Snyk dependency scan
        if: github.event_name == 'push'
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: |
            --severity-threshold=high
            --all-projects
            --remote-repo-url=https://github.com/onideus/context-library

      - name: Notify on completion
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "Notifications skipped: NTFY_URL is not set."
            exit 0
          fi
          STATUS="${{ job.status }}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TITLE="PR #${PR_NUMBER}: ${PR_TITLE}"
          else
            TITLE="Push to ${REF_NAME}"
          fi
          curl -s -o /dev/null \
            -H "Title: CI ${STATUS}: ${TITLE}" \
            -H "Priority: $( [ "$STATUS" = "success" ] && echo "default" || echo "high" )" \
            -H "Tags: $( [ "$STATUS" = "success" ] && echo "white_check_mark" || echo "x" )" \
            -d "Build ${STATUS} for context-library" \
            "$NTFY_URL" || true
