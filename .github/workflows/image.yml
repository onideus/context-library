name: image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci-checks.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      NTFY_URL: ${{ secrets.NTFY_URL }}

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Compute short SHA
        id: sha
        run: echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            -t ghcr.io/onideus/context-library:sha-${{ steps.sha.outputs.short_sha }} \
            .

      # Trivy replaces the Snyk container scan; the Snyk dependency scan in
      # ci-checks.yml stays (it passes --remote-repo-url, which exempts a
      # public repo from Free-plan test limits). `snyk container test` has no
      # such flag, so every push to main burned one of the plan's 100
      # container tests per month. Trivy needs no account or token.
      #
      # ignore-unfixed is the working equivalent of Snyk's
      # --exclude-base-image-vulns: node:22-slim ships dozens of HIGH Debian
      # CVEs with no fix available, which we cannot patch. Anything with a
      # fix, in our own layers or in the base image, still fails the gate;
      # a base-image fix means rebuilding on a newer node:22-slim.
      # Caching is on by default in the action, which the maintainers
      # recommend to avoid vulnerability-DB rate limits.
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/onideus/context-library:sha-${{ steps.sha.outputs.short_sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SHA-tagged image to GHCR
        run: docker push ghcr.io/onideus/context-library:sha-${{ steps.sha.outputs.short_sha }}

      - name: Notify on completion
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          STATUS="${{ job.status }}"
          curl -s -o /dev/null \
            -H "Title: Image ${STATUS}: sha-${{ steps.sha.outputs.short_sha }}" \
            -H "Priority: $( [ "$STATUS" = "success" ] && echo "default" || echo "high" )" \
            -H "Tags: $( [ "$STATUS" = "success" ] && echo "white_check_mark" || echo "x" )" \
            -d "Image build ${STATUS} for sha-${{ steps.sha.outputs.short_sha }}" \
            "${NTFY_URL:-https://ntfy.sh/context-library-ci}" || true
