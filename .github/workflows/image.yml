name: image

# Builds the image only after the ci workflow has passed for a push to main,
# reusing that run instead of running ci-checks a second time. workflow_run
# always executes this file as it exists on the default branch, and GITHUB_SHA
# is the default branch head at trigger time, so every step below works from
# the commit ci actually tested: workflow_run.head_sha.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    # The branches filter matches the head branch name only, which a fork PR
    # can also call "main"; requiring a push event in this repository rules
    # that out.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute short SHA
        id: sha
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short_sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Unreleased builds report 0.0.0-sha.<short> from /health. release.yml
      # stamps the real version onto this same image when it is released;
      # package.json's version (0.0.0-development) is not used for either.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=0.0.0-sha.${{ steps.sha.outputs.short_sha }} \
            -t ghcr.io/onideus/context-library:sha-${{ steps.sha.outputs.short_sha }} \
            .

      # Trivy is the only vulnerability scan in the pipeline. It replaced the
      # Snyk container scan, which burned one of the Free plan's 100 container
      # tests per month on every push to main, and then the Snyk dependency
      # scan too: vuln-type includes "library", so it also checks the npm
      # packages installed in the image, and Dependabot alerts cover
      # package-lock.json between pushes. Trivy needs no account or token.
      #
      # ignore-unfixed is the working equivalent of Snyk's
      # --exclude-base-image-vulns: node:22-slim ships dozens of HIGH Debian
      # CVEs with no fix available, which we cannot patch. Anything with a
      # fix, in our own layers or in the base image, still fails the gate;
      # a base-image fix means rebuilding on a newer node:22-slim.
      # Caching is on by default in the action, which the maintainers
      # recommend to avoid vulnerability-DB rate limits.
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/onideus/context-library:sha-${{ steps.sha.outputs.short_sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SHA-tagged image to GHCR
        run: docker push ghcr.io/onideus/context-library:sha-${{ steps.sha.outputs.short_sha }}

      - name: Notify on completion
        if: always()
        uses: ./.github/actions/ntfy-notify
        with:
          url: ${{ secrets.NTFY_URL }}
          token: ${{ secrets.NTFY_TOKEN }}
          title: "Image ${{ job.status }}: sha-${{ steps.sha.outputs.short_sha }}"
          message: Image build ${{ job.status }} for sha-${{ steps.sha.outputs.short_sha }}
          priority: ${{ job.status == 'success' && 'default' || 'high' }}
          tags: ${{ job.status == 'success' && 'white_check_mark' || 'x' }}
