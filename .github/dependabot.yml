# Dependabot version updates. Security updates are enabled separately in the
# repository settings and are not configured here.
#
# Both ecosystems run weekly with minor and patch updates grouped into one PR
# each, so a busy week is at most one npm PR, one actions PR, plus any majors
# (majors stay as individual PRs so their changelogs get read).
# The github-actions entry is what keeps the SHA-pinned `uses:` lines fresh;
# Dependabot bumps the pinned commit and the trailing version comment together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
